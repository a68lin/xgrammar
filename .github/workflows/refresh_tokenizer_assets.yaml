name: Refresh tokenizer assets

on:
  workflow_call:
    inputs:
      source_ref:
        required: false
        default: ''
        type: string
    secrets:
      HF_TOKEN:
        required: false
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
    inputs:
      source_ref:
        description: Optional source branch for testing refresh changes before merge
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: refresh-tokenizer-assets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Select asset set
        id: mode
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            echo "name=full" >> "$GITHUB_OUTPUT"
          else
            echo "name=public" >> "$GITHUB_OUTPUT"
          fi

      # Only default-branch runs publish caches; all PRs can read that scope.
      - name: Require the default branch cache scope
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"

      - name: Restore previous public bundle for content comparison
        uses: actions/cache/restore@v4
        with:
          path: .ci/published/public/tokenizer-assets.zip
          key: tokenizer-bundle-v2-public-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tokenizer-bundle-v2-public-

      - name: Restore previous full bundle for content comparison
        if: steps.mode.outputs.name == 'full'
        uses: actions/cache/restore@v4
        with:
          path: .ci/published/full/tokenizer-assets.zip
          key: tokenizer-bundle-v2-full-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tokenizer-bundle-v2-full-

      - name: Fetch current tokenizer and config assets
        id: fetch
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DOWNLOAD_TIMEOUT: 60
        run: |
          python -m pip install "huggingface_hub>=1.2,<2"
          python scripts/prepare_tokenizer_assets.py \
            --archive .ci/published/${{ steps.mode.outputs.name }}/tokenizer-assets.zip \
            --public-archive .ci/published/public/tokenizer-assets.zip

      - name: Verify complete bundles without running model tests
        run: |
          python scripts/verify_tokenizer_bundle.py .ci/published/public/tokenizer-assets.zip
          if [ "${{ steps.mode.outputs.name }}" = "full" ]; then
            python scripts/verify_tokenizer_bundle.py .ci/published/full/tokenizer-assets.zip --full
          fi

      - name: Publish changed public bundle
        if: steps.fetch.outputs.public_changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci/published/public/tokenizer-assets.zip
          key: tokenizer-bundle-v2-public-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish changed full bundle
        if: steps.mode.outputs.name == 'full' && steps.fetch.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci/published/full/tokenizer-assets.zip
          key: tokenizer-bundle-v2-full-${{ github.run_id }}-${{ github.run_attempt }}
